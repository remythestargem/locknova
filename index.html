<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7ff"><meta name="description" content="LockNova — a soft, light-mode customization playground inspired by ColorOS and Good Lock.">
<title>LockNova — Make your phone feel like yours</title>
<style>
:root{color-scheme:light;--ink:#28283d;--muted:#77788f;--purple:#7664d9;--purple2:#a69bf0;--lav:#efedff;--line:#e9e7f4;--paper:#fff;--bg:#f8f7fc;--mint:#e4f6ef;--peach:#fff0e7;--blue:#e9f3ff;--shadow:0 12px 35px #4940780b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a69bf0;outline-offset:3px}.app{max-width:1160px;margin:auto;padding:24px 26px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:27px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.7px}.brandmark{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#9d90f1,#7161d4);color:#fff;box-shadow:0 7px 18px #8b7be544}.brand small{display:block;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--muted)}.avatar{border:1px solid var(--line);background:#fff;color:var(--purple);border-radius:50%;width:42px;height:42px;font-weight:800}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--purple);font-weight:800}.hero{position:relative;overflow:hidden;border-radius:30px;padding:36px;background:linear-gradient(115deg,#f0edff 0%,#f5f3ff 48%,#eaf5ff 100%);display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;min-height:260px}.hero h1{font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-1.8px;margin:12px 0}.hero p{max-width:450px;color:#686982;margin:0 0 23px}.primary,.secondary{border:0;border-radius:13px;padding:12px 17px;font-weight:750}.primary{background:var(--purple);color:white;box-shadow:0 7px 16px #7664d92b}.secondary{background:#f0eeff;color:var(--purple)}.heroart{height:185px;position:relative;display:grid;place-items:center}.orb{position:absolute;width:190px;height:190px;border-radius:50%;background:linear-gradient(145deg,#d9d4ff,#e5f3ff);right:8%;top:-5px}.phone{position:relative;width:112px;height:176px;border:5px solid #fff;border-radius:25px;background:linear-gradient(160deg,#c6c0fa,#f3e8ff 55%,#cce6f8);box-shadow:0 14px 30px #6c64a52b;transform:rotate(7deg);padding:12px 9px}.phone:before{content:"";position:absolute;top:5px;left:35px;width:32px;height:8px;background:#fff;border-radius:8px}.phoneclock{font-size:25px;font-weight:750;text-align:center;margin-top:20px;color:#5b5290}.phonepill{height:25px;border-radius:12px;background:#ffffffa8;margin-top:12px}.phonepill:nth-child(3){width:80%;margin-inline:auto}.spark{position:absolute;color:#a095eb;font-size:28px}.spark.one{top:12px;right:16%}.spark.two{bottom:6px;left:12%}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:32px 0 16px}.sectionhead h2{font-size:21px;letter-spacing:-.6px;margin:3px 0}.sectionhead p{color:var(--muted);margin:0;font-size:13px}.textbutton{border:0;background:none;color:var(--purple);font-weight:750;padding:8px}.modulegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.module{border:1px solid var(--line);background:#fff;border-radius:21px;padding:19px;text-align:left;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;width:100%;color:inherit}.module:hover{transform:translateY(-3px);border-color:#c9c2fa}.moduleicon{height:45px;width:45px;display:grid;place-items:center;border-radius:15px;font-size:22px;margin-bottom:15px}.module h3{font-size:16px;margin:0 0 5px}.module p{font-size:12px;color:var(--muted);margin:0 0 15px;min-height:36px}.modulefoot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--purple);font-weight:750}.pill{background:#f0eeff;border-radius:100px;padding:5px 9px;font-size:10px;color:#6c5bc7}.bottomnav{position:fixed;z-index:10;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:8px;background:#fffffff0;border:1px solid #e9e7f4;border-radius:22px;box-shadow:0 12px 40px #514a761b;backdrop-filter:blur(14px)}.navitem{border:0;background:transparent;color:#89899e;border-radius:15px;padding:10px 15px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750}.navitem.active{background:var(--lav);color:var(--purple)}.contentpage{margin-top:25px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);margin-bottom:15px}.panel h3{margin:0 0 5px;font-size:16px}.panel .hint{color:var(--muted);font-size:13px;margin:0 0 18px}.setting{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0;border-top:1px solid #f0eff7}.setting:first-of-type{border-top:0}.setting strong{display:block;font-size:14px}.setting small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.switch{width:46px;height:27px;flex-shrink:0;border:0;border-radius:30px;background:#e4e3ed;padding:3px;transition:background .2s}.switch:after{content:"";display:block;width:21px;height:21px;border-radius:50%;background:white;box-shadow:0 1px 4px #0002;transition:transform .2s}.switch[aria-checked=true]{background:var(--purple)}.switch[aria-checked=true]:after{transform:translateX(19px)}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid var(--line);background:white;color:#686880;border-radius:12px;padding:10px 13px;font-size:13px}.choice.selected{border-color:#bcb2fb;background:#f1efff;color:#5e4dc1;font-weight:750}.select{background:#faf9ff;border:1px solid var(--line);padding:10px 12px;border-radius:11px;color:var(--ink);max-width:55%}.range{width:150px;accent-color:var(--purple)}.preview{border-radius:18px;background:linear-gradient(135deg,#f1edff,#e9f5ff);padding:22px;text-align:center;margin-bottom:18px}.preview .time{font-size:40px;font-weight:750;letter-spacing:-1.5px;color:#5c5492}.preview .sub{font-size:12px;color:#7d7a9f}.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.tile{border:1px solid #e4e1f7;background:#fff;border-radius:14px;padding:13px 8px;color:#6d6c86;font-size:12px}.tile.on{background:#e6e1ff;border-color:#d0c8ff;color:#5f50c0}.brightness{width:100%;accent-color:var(--purple);margin-top:12px}.mini-phone{max-width:210px;margin:8px auto 0;background:#fff;border:5px solid white;border-radius:27px;padding:18px 13px;box-shadow:0 5px 20px #6d65a51b}.mini-phone .time{font-size:30px}.mini-phone .widget{background:#f1efff;border-radius:12px;padding:12px;margin-top:12px;font-size:12px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:30;background:#302d49;color:white;padding:11px 17px;border-radius:12px;box-shadow:0 8px 25px #0002;font-size:13px}.empty{text-align:center;padding:35px 20px}.empty .big{font-size:40px}.footer{text-align:center;color:#9392a7;font-size:11px;margin:28px 0 0}.hidden{display:none!important}
@media(max-width:720px){.app{padding:18px 15px 105px}.hero{padding:25px 23px;grid-template-columns:1fr;min-height:unset}.heroart{height:145px;grid-row:1}.heroart .orb{right:25%;width:150px;height:150px}.heroart .phone{transform:rotate(5deg) scale(.82)}.hero h1{font-size:34px}.modulegrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.module{padding:15px;border-radius:18px}.module p{min-height:54px}.sectionhead{margin-top:26px}.navitem{padding:10px 12px;gap:5px}.navitem span:last-child{display:none}.panel{padding:17px}.setting{gap:12px}.range{width:105px}}
@media(max-width:390px){.modulegrid{grid-template-columns:1fr}.module p{min-height:0}.navitem{padding:10px}.brand{font-size:19px}}
</style>
</head>
<body>
<div id="app" class="app">
<header class="topbar"><div class="brand"><div class="brandmark">✦</div><div>LockNova<small>YOUR PHONE, YOUR FEEL</small></div></div><button class="avatar" aria-label="Open settings" data-page="more">R</button></header>
<main id="main"></main>
<footer class="footer">LockNova prototype · Made for personalisation, not system-level changes</footer>
</div>
<nav class="bottomnav" aria-label="Main navigation">
<button class="navitem active" data-page="home">⌂ <span>Home</span></button><button class="navitem" data-page="explore">✧ <span>Explore</span></button><button class="navitem" data-page="backups">▤ <span>Backups</span></button><button class="navitem" data-page="more">☷ <span>More</span></button>
</nav><div id="toast" class="toast hidden" role="status"></div>
<script>
const modules=[
{id:'status',name:'Status Bar',icon:'◉',color:'#efedff',desc:'Shape your status bar and compact island.',tag:'Interface',settings:[['Show compact island','Preview a pill-style status indicator.','toggle',true],['Clock','Show time in the status bar.','toggle',true],['Battery percentage','Display the battery percentage.','toggle',true],['Network speed','Show a simulated network-speed label.','toggle',false],['Island position','Choose where the preview appears.','choice',['Center','Left','Right']],['Island size','Adjust the mock island size.','range',48,100,72]]},
{id:'quick',name:'Quick Panel',icon:'☷',color:'#e7f5ff',desc:'Arrange quick settings your way.',tag:'Controls',settings:[['Wi-Fi','Toggle the preview Wi-Fi tile.','toggle',true],['Bluetooth','Toggle the preview Bluetooth tile.','toggle',true],['Sound','Toggle the preview sound tile.','toggle',true],['Airplane mode','Toggle the preview airplane tile.','toggle',false],['Location','Toggle the preview location tile.','toggle',true],['Tile layout','Choose the tile arrangement.','choice',['2 columns','3 columns','4 columns']],['Panel style','Choose a panel look.','choice',['Soft cards','Outline','Frosted']]]},
{id:'lock',name:'Lock Screen',icon:'◷',color:'#fff0e7',desc:'Explore clocks, widgets and wallpaper effects.',tag:'Personalise',settings:[['Clock style','Choose a lock-screen clock.','choice',['Classic','Rounded','Elegant']],['Weather widget','Show a sample weather card.','toggle',true],['Date widget','Show the date beneath the clock.','toggle',true],['Double-tap to sleep','Preview this gesture setting.','toggle',false],['Wallpaper blur','Adjust the mock wallpaper blur.','range',0,20,4]]},
{id:'homeui',name:'Home Screen',icon:'▦',color:'#e4f6ef',desc:'Tune grids, icon shapes and spacing.',tag:'Layout',settings:[['App labels','Show labels under icons.','toggle',true],['Icon shape','Choose a shape for preview icons.','choice',['Rounded','Circle','Squircle','Square']],['Home grid','Choose the number of columns.','choice',['4 × 5','4 × 6','5 × 6','5 × 7']],['Icon size','Resize the sample icons.','range',70,125,100],['Grid spacing','Adjust space between icons.','range',6,24,14]]},
{id:'gestures',name:'Gestures',icon:'⌁',color:'#fff2e4',desc:'Set up shortcut ideas for common gestures.',tag:'Shortcuts',settings:[['Swipe up','Choose what swipe up would do.','choice',['Open search','Open app drawer','Open quick panel']],['Swipe down','Choose what swipe down would do.','choice',['Notifications','Quick settings','Search']],['Double tap','Choose the double-tap action.','choice',['Lock screen','Open camera','None']],['Three-finger gesture','Choose a gesture shortcut.','choice',['Screenshot','Recent apps','None']]]},
{id:'system',name:'System UI',icon:'✧',color:'#f3eaff',desc:'Preview notification and media styling.',tag:'Appearance',settings:[['Compact notifications','Use a smaller notification preview.','toggle',true],['Media player','Show the sample media card.','toggle',true],['Hide status bar in apps','Preview immersive app styling.','toggle',false],['Edge lighting','Preview a soft edge-light effect.','toggle',false],['Force dark mode','Keep this prototype in light mode instead.','toggle',false]]}
];
const defaults={};modules.forEach(m=>m.settings.forEach(s=>defaults[m.id+'.'+s[0]]=s[3]));let state={...defaults,...JSON.parse(localStorage.getItem('locknova-settings')||'{}')};let page='home',activeModule=null;let backups=JSON.parse(localStorage.getItem('locknova-backups')||'[]');
const main=document.getElementById('main');
function save(){localStorage.setItem('locknova-settings',JSON.stringify(state))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2300)}
function settingKey(m,s){return m.id+'.'+s[0]}
function switchHtml(key,val){return '<button class="switch" role="switch" aria-checked="'+!!val+'" aria-label="'+key.split('.').slice(1).join(' ')+'" data-toggle="'+key+'"></button>'}
function rowHtml(m,s){const key=settingKey(m,s),v=state[key];let control='';if(s[2]==='toggle')control=switchHtml(key,v);if(s[2]==='choice')control='<div class="choices">'+s[3].map(x=>'<button class="choice '+(v===x?'selected':'')+'" data-choice="'+key+'" data-value="'+x+'">'+x+'</button>').join('')+'</div>';if(s[2]==='range')control='<input class="range" aria-label="'+s[0]+'" type="range" min="'+s[3]+'" max="'+s[4]+'" value="'+v+'" data-range="'+key+'"> <span data-value-for="'+key+'">'+v+(s[0].includes('size')?'%':'')+'</span>';return '<div class="setting"><div><strong>'+s[0]+'</strong><small>'+s[1]+'</small></div><div>'+control+'</div></div>'}
function moduleCard(m){return '<button class="module" data-module="'+m.id+'"><div class="moduleicon" style="background:'+m.color+'">'+m.icon+'</div><h3>'+m.name+'</h3><p>'+m.desc+'</p><div class="modulefoot"><span>'+m.tag+'</span><span>Explore ↗</span></div></button>'}
function home(){return '<section class="hero"><div><div class="eyebrow">A softer kind of customisation</div><h1>Make your phone<br>feel like <span style="color:var(--purple)">you.</span></h1><p>A calm little playground for your favourite interface ideas. Try a look, adjust the details, make it yours.</p><button class="primary" data-page="explore">Explore modules&nbsp; ↗</button></div><div class="heroart" aria-hidden="true"><div class="orb"></div><div class="phone"><div class="phoneclock">9:41</div><div class="phonepill"></div><div class="phonepill"></div><div class="phonepill" style="width:55%;margin-inline:auto"></div></div><span class="spark one">✦</span><span class="spark two">✧</span></div></section><div class="sectionhead"><div><div class="eyebrow">Your toolkit</div><h2>Little details, big difference</h2><p>Pick a module to start shaping your interface.</p></div><button class="textbutton" data-page="explore">View all →</button></div><section class="modulegrid">'+modules.map(moduleCard).join('')+'</section>'}
function preview(m){if(m.id==='status')return '<div class="preview"><div class="sub">STATUS BAR PREVIEW</div><div style="display:flex;justify-content:space-between;font-size:11px;margin:12px 4px;color:#6e6b91"><span>9:41</span><span>▮ ▰ ◉</span></div><div style="margin:auto;border-radius:50px;background:#343248;color:white;padding:9px 15px;width:'+state[m.id+'.Island size']+'%;max-width:230px;font-size:11px">● &nbsp; Music playing &nbsp; ◖</div><div class="sub" style="margin-top:12px">A visual preview only</div></div>';if(m.id==='quick')return '<div class="preview"><div class="sub">QUICK PANEL PREVIEW</div><div class="tilegrid">'+[['Wi-Fi','Wi-Fi'],['Bluetooth','Bluetooth'],['Sound','Sound'],['Airplane mode','Airplane mode'],['Location','Location']].map(a=>'<button class="tile '+(state[m.id+'.'+a[1]]?'on':'')+'" data-toggle="'+m.id+'.'+a[1]+'">'+a[0]+'</button>').join('')+'</div><input aria-label="Brightness preview" class="brightness" type="range" min="10" max="100" value="72"></div>';if(m.id==='lock')return '<div class="preview"><div class="sub">LOCK SCREEN PREVIEW</div><div class="mini-phone"><div class="sub">MONDAY · OCTOBER 25</div><div class="time" style="font-family:'+(state[m.id+'.Clock style']==='Elegant'?'Georgia,serif':'inherit')+'">9:41</div>'+(state[m.id+'.Date widget']?'<div class="sub">Monday, October 25</div>':'')+(state[m.id+'.Weather widget']?'<div class="widget">☀ &nbsp; Sunny skies · 27°</div>':'')+'</div></div>';if(m.id==='homeui')return '<div class="preview"><div class="sub">HOME SCREEN PREVIEW</div><div class="tilegrid">'+['✿','◈','☁','♫','✦','◉'].map((x,i)=>'<div style="font-size:'+Math.max(20,state[m.id+'.Icon size']*.25)+'px;color:#796bd0;padding:8px">'+x+(state[m.id+'.App labels']?'<div style="font-size:10px;color:#77788f">App '+(i+1)+'</div>':'')+'</div>').join('')+'</div></div>';if(m.id==='gestures')return '<div class="preview"><div style="font-size:30px;color:#8b7be0">↗ &nbsp; ↘ &nbsp; ⌁</div><strong>Shortcuts, your way</strong><div class="sub">Choose an action for each gesture below.</div></div>';return '<div class="preview"><div class="sub">SYSTEM UI PREVIEW</div>'+(state[m.id+'.Media player']?'<div style="text-align:left;background:#fff;border-radius:16px;padding:14px;margin-top:10px"><strong>♫ &nbsp; Soft Focus</strong><div class="sub">LockNova radio · Ambient</div><div style="margin-top:10px;color:#7664d9">◁ &nbsp;&nbsp;Ⅱ&nbsp;&nbsp; ▷</div></div>':'')+(state[m.id+'.Compact notifications']?'<div style="text-align:left;background:#fff;border-radius:13px;padding:12px;margin-top:10px;font-size:12px">✧ &nbsp; <strong>Quiet updates</strong><div class="sub">Your notifications, made softer.</div></div>':'')+'</div>'}
function modulePage(m){return '<div class="contentpage"><button class="textbutton" data-page="home">← Back home</button><div class="sectionhead"><div><div class="eyebrow">'+m.tag+'</div><h2>'+m.icon+' &nbsp;'+m.name+'</h2><p>'+m.desc+'</p></div><span class="pill">Prototype</span></div>'+preview(m)+'<section class="panel"><h3>Make it yours</h3><p class="hint">Changes update the preview and are saved on this device.</p>'+m.settings.map(s=>rowHtml(m,s)).join('')+'</section><p class="hint">Some options are demonstrations. Actual system-level changes require a native Android implementation and compatible ColorOS permissions.</p></div>'}
function explore(){return '<div class="sectionhead"><div><div class="eyebrow">Find your vibe</div><h2>Explore modules</h2><p>Six places to experiment with your interface.</p></div></div><section class="modulegrid">'+modules.map(moduleCard).join('')+'</section>'}
function backupsPage(){return '<div class="sectionhead"><div><div class="eyebrow">Keep your setup</div><h2>Backups</h2><p>Save and restore your prototype preferences locally.</p></div></div><section class="panel"><h3>Your settings, kept safe</h3><p class="hint">Backups stay in this browser on this device. They are not uploaded to a server.</p><button class="primary" id="create-backup">＋ Create backup</button> <button class="secondary" id="restore-defaults">Restore defaults</button></section><section class="panel"><h3>Saved backups</h3>'+(backups.length?backups.map((b,i)=>'<div class="setting"><div><strong>LockNova setup '+(backups.length-i)+'</strong><small>'+new Date(b.date).toLocaleString()+'</small></div><button class="choice" data-restore="'+i+'">Restore</button></div>').join(''):'<div class="empty"><div class="big">▤</div><strong>No backups yet</strong><p class="hint">Create a backup to save your current settings.</p></div>')+'</section>'}
function morePage(){return '<div class="sectionhead"><div><div class="eyebrow">A little about us</div><h2>More</h2><p>LockNova is a soft, light-mode customization concept.</p></div></div><section class="panel"><h3>About LockNova</h3><p class="hint">A Good Lock-inspired companion concept for exploring interface customisation ideas, designed with ColorOS users in mind.</p><div class="setting"><div><strong>Appearance</strong><small>Light mode · Soft lavender accents</small></div><span class="pill">Always on</span></div><div class="setting"><div><strong>Data storage</strong><small>Preferences stay in this browser's local storage.</small></div><span>⌂</span></div><div class="setting"><div><strong>Native system access</strong><small>This web prototype does not change your phone's actual system UI.</small></div><span>ⓘ</span></div><div class="setting"><div><strong>Reset settings</strong><small>Clear customizations and return to defaults.</small></div><button class="secondary" id="reset-settings">Reset</button></div><div class="setting"><div><strong>Project source</strong><small>Open the public GitHub repository.</small></div><a class="textbutton" href="https://github.com/remythestargem/locknova" target="_blank" rel="noreferrer">GitHub ↗</a></div></section>'}
function render(){main.innerHTML=page==='home'?home():page==='explore'?explore():page==='backups'?backupsPage():page==='more'?morePage():modulePage(modules.find(m=>m.id===activeModule)||modules[0]);document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function go(p){page=p;activeModule=null;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const pg=e.target.closest('[data-page]');if(pg){go(pg.dataset.page);return}const mod=e.target.closest('[data-module]');if(mod){page='module';activeModule=mod.dataset.module;render();window.scrollTo({top:0,behavior:'smooth'});return}const tog=e.target.closest('[data-toggle]');if(tog){const k=tog.dataset.toggle;state[k]=!state[k];save();render();return}const choice=e.target.closest('[data-choice]');if(choice){state[choice.dataset.choice]=choice.dataset.value;save();render();return}const restore=e.target.closest('[data-restore]');if(restore){state={...defaults,...backups[Number(restore.dataset.restore)].state};save();render();toast('Backup restored');return}if(e.target.id==='create-backup'){backups.unshift({date:new Date().toISOString(),state:{...state}});localStorage.setItem('locknova-backups',JSON.stringify(backups));render();toast('Backup saved on this device');return}if(e.target.id==='restore-defaults'||e.target.id==='reset-settings'){if(confirm('Restore all LockNova settings to their defaults?')){state={...defaults};save();render();toast('Defaults restored')}return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-range]')){const k=e.target.dataset.range;state[k]=Number(e.target.value);const out=document.querySelector('[data-value-for="'+k+'"]');if(out)out.textContent=state[k]+(k.toLowerCase().includes('size')?'%':'');save();if(activeModule==='homeui'||activeModule==='status'){const pos=window.scrollY;render();window.scrollTo(0,pos)} }});
render();
</script>
</body></html>
